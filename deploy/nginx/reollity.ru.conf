server {
    listen 80;
    server_name reollity.ru www.reollity.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name reollity.ru;

    ssl_certificate /etc/letsencrypt/live/reollity.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reollity.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    client_body_timeout 300s;

    root /var/www/reollity;

    # API reverse proxy - без trailing slash в location
    location = /api { return 301 /api/; }
    location /api/ {
        proxy_pass https://api.reollity.ru/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.reollity.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Оболочка Flutter. Эти URL не меняются между сборками, поэтому их нельзя
    # отдавать как immutable: иначе браузер год держит старый main.dart.js.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    # CanvasKit не имеет хеша в имени. Долгий кэш оставлял старый wasm
    # рядом с новым main.dart.js, и движок не стартовал до жёсткого обновления.
    location ^~ /canvaskit/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
    }
}
