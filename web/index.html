<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Reollity — чаты, звонки и учёт занятий">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="reollity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>reollity</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Старый service worker Flutter перехватывает запросы и может отдать смесь
    // файлов разных сборок. Снимаем его и чистим Cache API до bootstrap.
    // Если worker ещё управляет вкладкой, перезагружаем страницу один раз.
    (function () {
      var BUILD_ID = 'FLUTTER_BUILD_ID';
      window.__REOLLITY_BUILD__ = BUILD_ID;
      var resetKey = 'reollity_sw_reset';

      function loadBootstrap() {
        if (window.__REOLLITY_BOOTSTRAPPED__) return;
        window.__REOLLITY_BOOTSTRAPPED__ = true;
        var bootstrap = document.createElement('script');
        bootstrap.async = true;
        bootstrap.src = 'flutter_bootstrap.js?v=' + BUILD_ID;
        document.body.appendChild(bootstrap);
      }

      function withTimeout(promise, ms) {
        return new Promise(function (resolve) {
          var done = false;
          function finish() {
            if (done) return;
            done = true;
            resolve();
          }
          setTimeout(finish, ms);
          Promise.resolve(promise).then(finish, finish);
        });
      }

      var preparing = Promise.resolve();
      try {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }));
        }
        if (window.caches && caches.keys) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }));
        }
        preparing = Promise.all(tasks);
      } catch (e) {}

      withTimeout(preparing, 2500).then(function () {
        var controlled = false;
        try {
          controlled = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;
        } catch (e) {}
        var alreadyReloaded = false;
        try {
          alreadyReloaded = sessionStorage.getItem(resetKey) === '1';
        } catch (e) {}
        if (controlled && !alreadyReloaded) {
          try { sessionStorage.setItem(resetKey, '1'); } catch (e) {}
          window.location.reload();
          return;
        }
        if (!controlled) {
          try { sessionStorage.removeItem(resetKey); } catch (e) {}
        }
        loadBootstrap();
      });
    })();
  </script>
</body>
</html>
