<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Reollity — чаты, звонки и учёт занятий">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="reollity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>reollity</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #08010F;
      color-scheme: dark;
    }
    #reollity-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #08010F 0%, #150827 50%, #7B2CBF 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .boot-col { display: flex; flex-direction: column; align-items: center; }
    .boot-mark {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #9D4EDD, #2DE2E6);
      box-shadow: 0 0 36px rgba(199, 125, 255, 0.55), 0 0 48px rgba(45, 226, 230, 0.35);
    }
    .boot-spin {
      margin-top: 32px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(45, 226, 230, 0.25);
      border-top-color: #2DE2E6;
      animation: reollity-spin 0.8s linear infinite;
    }
    .boot-label {
      margin-top: 16px;
      color: rgba(237, 230, 247, 0.85);
      font-size: 16px;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    @keyframes reollity-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="reollity-boot">
    <div class="boot-col">
      <div class="boot-mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <path fill="#fff" d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4.5 3.2A.8.8 0 0 1 4 18.5V16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
        </svg>
      </div>
      <div class="boot-spin"></div>
      <div class="boot-label">Загрузка...</div>
    </div>
  </div>
  <script>
    // Старый service worker может отдать смесь файлов разных сборок.
    // Если он ещё управляет вкладкой — снимаем и перезагружаем один раз.
    // Иначе приложение начинает скачиваться сразу, очистка кэша идёт следом.
    (function () {
      var BUILD_ID = 'FLUTTER_BUILD_ID';
      window.__REOLLITY_BUILD__ = BUILD_ID;
      var resetKey = 'reollity_sw_reset';

      function loadBootstrap() {
        if (window.__REOLLITY_BOOTSTRAPPED__) return;
        window.__REOLLITY_BOOTSTRAPPED__ = true;
        var bootstrap = document.createElement('script');
        bootstrap.async = true;
        bootstrap.src = 'flutter_bootstrap.js?v=' + BUILD_ID;
        document.body.appendChild(bootstrap);
      }

      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('reollity-boot');
        if (splash) splash.remove();
      });

      function withTimeout(promise, ms) {
        return new Promise(function (resolve) {
          var done = false;
          function finish() {
            if (done) return;
            done = true;
            resolve();
          }
          setTimeout(finish, ms);
          Promise.resolve(promise).then(finish, finish);
        });
      }

      var preparing = Promise.resolve();
      try {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }));
        }
        if (window.caches && caches.keys) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }));
        }
        preparing = Promise.all(tasks);
      } catch (e) {}

      var controlled = false;
      try {
        controlled = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;
      } catch (e) {}
      var alreadyReloaded = false;
      try {
        alreadyReloaded = sessionStorage.getItem(resetKey) === '1';
      } catch (e) {}
      if (controlled && !alreadyReloaded) {
        withTimeout(preparing, 2500).then(function () {
          try { sessionStorage.setItem(resetKey, '1'); } catch (e) {}
          window.location.reload();
        });
      } else {
        if (!controlled) {
          try { sessionStorage.removeItem(resetKey); } catch (e) {}
        }
        loadBootstrap();
        preparing.then(function () {}, function () {});
      }
    })();
  </script>
</body>
</html>
