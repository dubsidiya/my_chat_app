name: Deploy web to reollity.ru

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - ".github/workflows/deploy-web-reollity.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-reollity
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run \
            --dart-define=API_BASE_URL=https://api.reollity.ru

      - name: Setup SSH key
        env:
          RECOVERY_KEY: ${{ secrets.REOLLITY_RECOVERY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RECOVERY_KEY" | tr -d '\r' > ~/.ssh/recovery_key
          chmod 600 ~/.ssh/recovery_key
          ssh-keygen -y -f ~/.ssh/recovery_key > /dev/null || { echo "::error::REOLLITY_RECOVERY_KEY повреждён"; exit 1; }
          ssh-keyscan -H 129.101.115.158 >> ~/.ssh/known_hosts

      - name: Deploy to recovery server
        run: |
          ssh -i ~/.ssh/recovery_key -o BatchMode=yes root@129.101.115.158 'mkdir -p /var/www/reollity'
          rsync -az --delete -e "ssh -i ~/.ssh/recovery_key -o BatchMode=yes" \
            build/web/ root@129.101.115.158:/var/www/reollity/

      - name: Smoke check
        run: |
          sleep 5
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://reollity.ru/)
          if [ "$CODE" != "200" ]; then
            echo "::error::Site returned $CODE after deploy"
            exit 1
          fi
          echo "✅ reollity.ru отвечает 200"
