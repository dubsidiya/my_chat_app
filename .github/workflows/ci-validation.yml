name: CI Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    name: Flutter Format Analyze Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enforce Dart formatting
        run: dart format --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

  backend-sanity:
    name: Backend Install And Smoke
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      REQUIRE_REDIS_TESTS: "1"
    defaults:
      run:
        working-directory: my_serve_chat_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my_serve_chat_test/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Call fakes (Redis + LiveKit + APNs + TURN)
        run: npm run smoke:calls:fakes

      - name: Run full backend unit suite
        run: npm test
