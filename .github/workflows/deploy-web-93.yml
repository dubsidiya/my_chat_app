name: Deploy web to 93.183.80.97

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - ".github/workflows/deploy-web-93.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-reollity
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter pub get
          # Keep the Flutter engine on our server: Google CDN may be unavailable
          # for users and causes the app to remain on its loading screen.
          flutter build web --release --no-wasm-dry-run --no-web-resources-cdn \
            --dart-define=API_BASE_URL=https://api.reollity.ru

      - name: Setup SSH key
        env:
          RECOVERY_KEY: ${{ secrets.REOLLITY_RECOVERY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RECOVERY_KEY" | tr -d '\r' > ~/.ssh/web_key
          chmod 600 ~/.ssh/web_key
          ssh-keygen -y -f ~/.ssh/web_key > /dev/null || { echo "::error::REOLLITY_RECOVERY_KEY повреждён"; exit 1; }
          ssh-keyscan -H 93.183.80.97 >> ~/.ssh/known_hosts

      - name: Deploy to web server
        run: |
          ssh -i ~/.ssh/web_key -o BatchMode=yes root@93.183.80.97 'mkdir -p /var/www/reollity'
          rsync -az --delete -e "ssh -i ~/.ssh/web_key -o BatchMode=yes" \
            build/web/ root@93.183.80.97:/var/www/reollity/

      - name: Smoke check on web server
        run: |
          ssh -i ~/.ssh/web_key -o BatchMode=yes root@93.183.80.97 '
            set -e
            test -s /var/www/reollity/index.html
            test -s /var/www/reollity/canvaskit/canvaskit.wasm
            test "$(curl -fsS -o /dev/null -w "%{http_code}" http://localhost/)" = "200"
          '
          echo "✅ web развёрнут на 93.183.80.97"
