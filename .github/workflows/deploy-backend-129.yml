# Deploy the Node.js backend to 129.101.115.158 (backend server).
# The server runs the application exclusively through systemd:
# reollity-chat.service. Do not add a PM2 process for this backend.
name: Deploy backend to 129.101.115.158

on:
  push:
    branches: [main]
    paths:
      - "my_serve_chat_test/**"
      - ".github/workflows/deploy-backend-129.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-reollity
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backend syntax
        run: node --check my_serve_chat_test/index.js

      - name: Set up SSH key
        env:
          RECOVERY_KEY: ${{ secrets.REOLLITY_RECOVERY_KEY }}
        run: |
          set -eu
          test -n "$RECOVERY_KEY" || { echo "::error::REOLLITY_RECOVERY_KEY is not configured"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RECOVERY_KEY" | tr -d '\r' > ~/.ssh/recovery_key
          chmod 600 ~/.ssh/recovery_key
          ssh-keygen -y -f ~/.ssh/recovery_key > /dev/null
          ssh-keyscan -H 129.101.115.158 >> ~/.ssh/known_hosts

      - name: Upload backend
        run: |
          set -eu
          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            -e "ssh -i ~/.ssh/recovery_key -o BatchMode=yes" \
            my_serve_chat_test/ root@129.101.115.158:/opt/reollity/backend/

      - name: Install, migrate, restart, and smoke test
        run: |
          ssh -i ~/.ssh/recovery_key -o BatchMode=yes root@129.101.115.158 '
            set -eu
            cd /opt/reollity/backend
            test -s .env || { echo "Missing /opt/reollity/backend/.env" >&2; exit 1; }
            npm ci --omit=dev
            npm run migrate:critical
            systemctl restart reollity-chat.service
            sleep 3
            systemctl is-active --quiet reollity-chat.service
            curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3100/healthz?warm=1 | grep -Fx ok
          '

      - name: Confirm public API
        run: curl --fail --silent --show-error --max-time 20 https://api.reollity.ru/healthz | grep -Fx ok
